name: release-guardian

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec: [safe, breaking]
    steps:
      - uses: actions/checkout@v4
      - name: Release Guardian (dry-run, no payment)
        id: guard
        uses: genesiscode2026/genesis-release-guardian@v1
        with:
          previous-spec: spec/baseline.json
          current-spec: spec/${{ matrix.spec }}.json
          mode: quick
          dry-run: 'true'
      - run: |
          echo "spec=${{ matrix.spec }}"
          echo "verdict=${{ steps.guard.outputs.verdict }}"
